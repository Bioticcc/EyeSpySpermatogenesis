[tool.poetry]
name = "eye-spy-spermatogenesis"
version = "0.1.0"
description = "Offline desktop app to classify mouse testis seminiferous tubule TIFF images into stage clusters."
authors = ["EyeSpySpermatogenesis Devs <dev@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "2.1.2"
torchvision = "0.16.2"
numpy = "^1.26.3"
pandas = "^2.1.4"
tifffile = "^2023.12.9"
Pillow = "^10.1.0"
scikit-learn = "^1.3.2"
tqdm = "^4.66.1"
matplotlib = "^3.8.2"
pyinstaller = "^6.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"
